name: Sentry triage

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install sentry-github-sync dependencies
        working-directory: tools/sentry-github-sync
        run: npm install

      - name: Run Sentry to GitHub triage
        working-directory: tools/sentry-github-sync
        run: npm start -- --sentry-token "$SENTRY_AUTH_TOKEN" --sentry-org "$SENTRY_ORG" --sentry-project "$SENTRY_ANDROID_PROJECT_ID" --sentry-project "$SENTRY_BACKEND_PROJECT_ID" --github-token "$GITHUB_TOKEN" --repo "$GITHUB_REPOSITORY"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_ANDROID_PROJECT_ID: ${{ vars.SENTRY_ANDROID_PROJECT_ID }}
          SENTRY_BACKEND_PROJECT_ID: ${{ vars.SENTRY_BACKEND_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
