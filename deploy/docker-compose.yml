services:
  buzer-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - /srv/buzer/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /data/buzer.sqlite
      WHATSAPP_SESSION_PATH: /data/whatsapp-sessions
    volumes:
      - /srv/buzer/data:/data
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
