services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buzer-backend
    restart: unless-stopped
    ports:
      - "${BUZER_BIND_HOST:-0.0.0.0}:${BUZER_HOST_PORT:-18432}:${BUZER_CONTAINER_PORT:-18432}"
    volumes:
      - buzer-data:/app/backend/data
      - buzer-whatsapp:/app/backend/whatsapp-sessions
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${BUZER_CONTAINER_PORT:-18432}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || '18432') + '/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  buzer-data:
  buzer-whatsapp:
